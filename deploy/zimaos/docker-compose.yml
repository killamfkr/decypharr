name: decypharr
services:
  decypharr:
    image: cy01/blackhole:latest
    container_name: decypharr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      # Replace with your Torbox API key from https://torbox.app/settings
      TORBOX_API_KEY: "PASTE_YOUR_TORBOX_API_KEY_HERE"
    ports:
      - "8282:8282"
    volumes:
      - /DATA/AppData/decypharr/config:/app
      - /DATA/AppData/decypharr/mount:/mnt:rshared
      - /DATA/AppData/decypharr/cache:/cache
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /app/logs /app/cache /app/downloads /app/rclone /mnt/decypharr /cache/rclone
        if [ -z "$$TORBOX_API_KEY" ] || [ "$$TORBOX_API_KEY" = "PASTE_YOUR_TORBOX_API_KEY_HERE" ]; then
          echo "ERROR: Edit docker-compose.yml and set TORBOX_API_KEY to your Torbox API key."
          exit 1
        fi
        if [ ! -f /app/config.json ]; then
          cat > /app/config.json <<CFG
        {
          "bind_address": "0.0.0.0",
          "port": "8282",
          "log_level": "info",
          "use_auth": false,
          "download_folder": "/app/downloads",
          "categories": ["sonarr", "radarr"],
          "debrids": [
            {
              "provider": "torbox",
              "name": "torbox",
              "api_key": "$$TORBOX_API_KEY"
            }
          ],
          "mount": {
            "type": "rclone",
            "mount_path": "/mnt/decypharr",
            "rclone": {
              "cache_dir": "/cache/rclone",
              "vfs_cache_mode": "writes",
              "vfs_cache_max_size": "10GB",
              "vfs_read_chunk_size": "128MB",
              "vfs_read_ahead": "256MB",
              "buffer_size": "16MB",
              "transfers": 4
            }
          }
        }
        CFG
        fi
        exec /entrypoint.sh /usr/bin/decypharr --config /app
