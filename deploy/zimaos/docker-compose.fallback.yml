name: decypharr
services:
  decypharr:
    image: cy01/blackhole:latest
    container_name: decypharr
    network_mode: bridge
    restart: unless-stopped
    privileged: false
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - TORBOX_API_KEY=
    ports:
      - target: 8282
        published: "8282"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/decypharr/config
        target: /app
      - type: bind
        source: /DATA/AppData/decypharr/mount
        target: /mnt
      - type: bind
        source: /DATA/AppData/decypharr/cache
        target: /cache
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    cap_drop: []
    security_opt:
      - apparmor:unconfined
    command:
      - /bin/sh
      - -c
      - mkdir -p /app/logs /app/cache /app/downloads /app/rclone /mnt/decypharr /cache/rclone && if [ -n "$$TORBOX_API_KEY" ]; then if [ ! -f /app/config.json ] || ! grep -q '"api_key"[[:space:]]*:[[:space:]]*"[^"]' /app/config.json 2>/dev/null || ! grep -q '"download_folder"' /app/config.json 2>/dev/null; then printf '%s' '{"bind_address":"0.0.0.0","port":"8282","log_level":"info","use_auth":false,"download_folder":"/app/downloads","categories":["sonarr","radarr"],"debrids":[{"provider":"torbox","name":"torbox","api_key":"' "$$TORBOX_API_KEY" '"}],"mount":{"type":"rclone","mount_path":"/mnt/decypharr","rclone":{"cache_dir":"/cache/rclone","vfs_cache_mode":"writes","vfs_cache_max_size":"10GB","vfs_read_chunk_size":"128MB","vfs_read_ahead":"256MB","buffer_size":"16MB","transfers":4}}}' > /app/config.json; fi; fi && exec /usr/bin/decypharr --config /app
